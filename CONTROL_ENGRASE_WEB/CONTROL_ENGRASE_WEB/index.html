<title>Control de Engrase · Open Pit</title>
<meta name="theme-color" content="#14171A"/>
<!-- Aplica el tema guardado ANTES de que el navegador pinte, para evitar el
     parpadeo oscuro→claro (auditoría UI/UX 2026-10-08, hallazgo #2): mismo
     default (accent azul-corp/mode light, paleta corporativa final
     2026-10-09) y misma clave de localStorage que getTheme()/applyTheme()
     en app.js — app.js sigue siendo la única fuente de la lógica de
     preferencias (lee/guarda), esto solo repite la LECTURA para el primer
     pintado, porque app.js es el último script en cargar. -->
<script>
(function () {
  try {
    var t = Object.assign({ accent: 'azul-corp', mode: 'light' }, JSON.parse(localStorage.getItem('engrase_theme')) || {});
    var aliases = { blue: 'azul-corp', green: 'verde-bosque', red: 'amarillo-cat', teal: 'petroleo-ejec', amber: 'cobre-ejec', petroleo: 'petroleo-ejec', purpura: 'violeta-ejec', ladrillo: 'amarillo-cat', cobre: 'cobre-ejec', graphite: 'grafito', acero: 'azul-acero', cian: 'azul-acero' };
    t.accent = aliases[t.accent] || t.accent;
    if (['azul-corp','verde-bosque','cobre-ejec','azul-acero','violeta-ejec','petroleo-ejec','amarillo-cat','grafito'].indexOf(t.accent) < 0) t.accent = 'azul-corp';
    if (['contrast','high-contrast','high_contrast'].indexOf(t.mode) >= 0) t.mode = 'sun';
    if (['light','dark','sun'].indexOf(t.mode) < 0) t.mode = 'light';
    document.documentElement.setAttribute('data-theme', t.accent);
    document.documentElement.setAttribute('data-mode', t.mode);
    var bg = t.mode === 'light' ? '#F4F6F8' : t.mode === 'sun' ? '#FFFFFF' : '#14171A';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', bg);
  } catch (e) {}
})();
</script>
