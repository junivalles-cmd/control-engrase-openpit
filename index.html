<!-- El SDK Web de OneSignal (notificaciones push en el NAVEGADOR, que lleguen
     aunque la pestaña esté cerrada) YA NO se carga aquí de forma incondicional.
     app.js -> initWebPush() lo inyecta dinámicamente solo cuando corresponde
     (navegador real, no dentro de la app Android/Capacitor) — ver NOTIF-ANDROID-001
     en docs/BUG_REGISTER.md. En la app instalada de Android se usa el plugin
     nativo (onesignal-cordova-plugin), no este SDK web. -->
  <link rel="stylesheet" crossorigin href="./styles.css">

<body>
<div class="loading">Cargando Control de Engrase…</div>
<script src="db.js"></script>
<!-- src/core/auth.js va ANTES de sync.js: sync.js consulta Auth.getMode()/
     Auth.isAuthenticated() (P0-2 Etapa B1, inerte mientras AUTH_MODE sea
     'legacy' — ver docs/AUTH_RLS_IMPLEMENTATION_PLAN.md). -->
<script src="src/core/auth.js"></script>
<!-- Quick unlock offline (P0-2) — depende de DB (db.js) y de nowISO(),
     independiente de sync.js/Auth en sí, ver src/core/quick-unlock.js. -->
<script src="src/core/quick-unlock.js"></script>
<script src="sync.js"></script>
<!-- Núcleo de lógica extraído de app.js (turnos, horómetro, estado de
     engrase, criticidad de anomalías) — ver docs/MODULARIZATION.md.
     Scripts clásicos igual que los de arriba: sin build, sin Vite. -->
<script src="src/core/shifts.js"></script>
<script src="src/core/hourmeter.js"></script>
<script src="src/core/lubrication-status.js"></script>
<script src="src/core/anomalies.js"></script>
<script src="src/core/anomaly-actions.js"></script>
<script src="src/core/weekly-matrix.js"></script>
<script src="src/core/plan-compliance.js"></script>
<script src="src/core/grease-validation.js"></script>
<!-- Rediseño operativo (dispositivos compartidos + cuadrillas + ubicaciones
     + asignación manual, ver docs/OPERATIONAL_SCOPE.md) — puro, sin DOM/DB
     directo, mismo patrón que weekly-matrix.js/plan-compliance.js. -->
<script src="src/core/operational-scope.js"></script>
<!-- Arquitectura de notificaciones (usuario+turno+disponibilidad+scope,
     lote 2026-09-30) — puro, mismo patrón que operational-scope.js. -->
<script src="src/core/notification-routing.js"></script>
<script src="app.js"></script>
